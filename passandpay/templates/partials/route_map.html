{% load static %}
<div class="route-map" style="height:{{ height }}px">
  <svg viewBox="0 0 {{ W }} {{ H }}" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
    <defs>
      <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
        <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#cdd9ec" stroke-width="1"/>
      </pattern>
      <linearGradient id="mapbg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#eaf1fb"/><stop offset="100%" stop-color="#dde8f7"/>
      </linearGradient>
    </defs>
    <rect width="{{ W }}" height="{{ H }}" fill="url(#mapbg)"/>
    <rect width="{{ W }}" height="{{ H }}" fill="url(#grid)"/>
    <g fill="#cfe0d4" opacity="0.55">
      <path d="M120 90 q60 -30 130 10 q70 40 40 120 q-30 80 -130 70 q-110 -10 -120 -110 q-5 -60 80 -90Z"/>
      <path d="M360 230 q50 -20 90 20 q40 50 -10 110 q-60 50 -120 10 q-40 -60 40 -150Z"/>
    </g>
    <path d="M {{ ox }} {{ oy }} Q {{ ctrl_x }} {{ ctrl_y }} {{ dx }} {{ dy }}"
          fill="none" stroke="#1A3D7C" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.85"/>
    <circle cx="{{ ox }}" cy="{{ oy }}" r="16" fill="#1A3D7C" opacity="0.15"/>
    <circle cx="{{ ox }}" cy="{{ oy }}" r="9" fill="#1A3D7C" stroke="#fff" stroke-width="3"/>
    <circle cx="{{ dx }}" cy="{{ dy }}" r="16" fill="#F5821F" opacity="0.18"/>
    <circle cx="{{ dx }}" cy="{{ dy }}" r="9" fill="#F5821F" stroke="#fff" stroke-width="3"/>
    {% if has_current %}
      <circle cx="{{ cx }}" cy="{{ cy }}" r="20" fill="#28A745" opacity="0.18"/>
      <circle cx="{{ cx }}" cy="{{ cy }}" r="14" fill="#28A745" stroke="#fff" stroke-width="2.5"/>
    {% endif %}
  </svg>
  {% if has_current %}
    <i class="bi bi-truck position-absolute text-white" style="left:{{ cx_pct }}%;top:{{ cy_pct }}%;transform:translate(-50%,-50%);font-size:.8rem"></i>
  {% endif %}
  <div class="position-absolute bottom-0 start-0 end-0 d-flex justify-content-between p-2">
    {% if origin_label %}<span class="badge bg-white text-brand shadow-sm"><i class="bi bi-geo-alt-fill"></i> {{ origin_label }}</span>{% endif %}
    {% if dest_label %}<span class="badge bg-white text-accent shadow-sm"><i class="bi bi-flag-fill"></i> {{ dest_label }}</span>{% endif %}
  </div>
  {% if live %}<span class="badge bg-success map-live-badge"><i class="bi bi-broadcast"></i> Live</span>{% endif %}
</div>
