<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TriageDesk — AI issue triage that proves itself</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
<style>
  :root { --bg:#0b0f17; --surface:#141b2b; --surface2:#0f1522; --border:#232d42; --text:#e8ecf4; --muted:#96a0b5; --accent:#5b8cff; --accent2:#9d6bff; --good:#34d399; --warn:#fbbf24; --bad:#f87171; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; line-height:1.55; min-height:100vh; }

  .nav { display:flex; align-items:center; justify-content:space-between; padding:14px 26px; border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.05rem; }
  .brand .logo { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:grid; place-items:center; }
  .brand small { color:var(--muted); font-weight:500; font-size:.75rem; display:block; }
  .tabs { display:flex; gap:8px; }
  .tabs button { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:7px 18px; cursor:pointer; font-size:.86rem; }
  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .wrap { max-width:940px; margin:0 auto; padding:26px 20px 60px; }
  .grid { display:grid; grid-template-columns:1fr 300px; gap:20px; align-items:start; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; }
  h2 { font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin-bottom:12px; }

  input, textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:11px 13px; margin-bottom:10px; font:inherit; font-size:.9rem; }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { min-height:150px; resize:vertical; }
  button.go { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:11px 26px; font-weight:600; cursor:pointer; font-size:.92rem; display:inline-flex; align-items:center; gap:9px; }
  button.go:disabled { opacity:.5; cursor:default; }
  .spin { width:14px; height:14px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:rot .7s linear infinite; display:none; }
  .loading .spin { display:inline-block; }
  @keyframes rot { to { transform:rotate(360deg); } }

  .sample { display:block; width:100%; text-align:left; background:var(--surface2); border:1px solid var(--border); color:var(--muted); border-radius:10px; padding:10px 13px; margin-bottom:8px; cursor:pointer; font-size:.8rem; line-height:1.4; }
  .sample:hover { border-color:var(--accent); color:var(--text); }
  .sample b { color:var(--text); display:block; font-size:.83rem; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 12px; }
  .chip { border-radius:999px; padding:5px 15px; font-size:.8rem; font-weight:600; background:rgba(91,140,255,.14); color:var(--accent); border:1px solid rgba(91,140,255,.3); }
  .chip.p-critical { background:rgba(248,113,113,.14); color:var(--bad); border-color:rgba(248,113,113,.4); }
  .chip.p-high { background:rgba(251,191,36,.12); color:var(--warn); border-color:rgba(251,191,36,.35); }
  .chip.p-medium { background:rgba(52,211,153,.1); color:var(--good); border-color:rgba(52,211,153,.3); }

  .draftbox { position:relative; background:var(--bg); border:1px dashed var(--border); border-radius:10px; padding:14px 14px 14px; font-size:.88rem; white-space:pre-wrap; }
  .copybtn { position:absolute; top:8px; right:8px; background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:7px; padding:4px 10px; font-size:.72rem; cursor:pointer; }
  .copybtn:hover { color:var(--text); border-color:var(--accent); }
  .meta { color:var(--muted); font-size:.76rem; margin-top:12px; }
  #result { display:none; margin-top:6px; border-top:1px solid var(--border); }

  .hist { border-bottom:1px solid var(--border); padding:10px 2px; font-size:.8rem; }
  .hist:last-child { border-bottom:0; }
  .hist .t { color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hist .m { color:var(--muted); font-size:.72rem; margin-top:2px; }
  .hist .m i { font-style:normal; font-weight:700; }
  .empty { color:var(--muted); font-size:.82rem; }

  table { width:100%; border-collapse:collapse; font-size:.85rem; margin-top:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:.76rem; text-transform:uppercase; letter-spacing:.06em; }
  .ok { color:var(--good); } .miss { color:var(--bad); }
  .stat { display:inline-block; margin:0 22px 12px 0; }
  .stat b { font-size:1.5rem; display:block; }
  .stat span { color:var(--muted); font-size:.76rem; }
  #evalbox { display:none; }
  @media (max-width:820px){ .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>

<nav class="nav">
  <div class="brand">
    <div class="logo">🎯</div>
    <div>TriageDesk<small>AI issue triage — measured, not vibes</small></div>
  </div>
  <div class="tabs">
    <button id="t1" class="active" onclick="tab(1)">Triage</button>
    <button id="t2" onclick="tab(2)">Evals & reliability</button>
  </div>
</nav>

<div class="wrap">
  <div class="grid" id="triagebox">
    <div class="panel">
      <h2>New issue</h2>
      <input id="title" placeholder="Issue title — e.g. App crashes on login" />
      <textarea id="body" placeholder="Paste the raw issue body — stack traces, angry customer emails, half-formed bug reports all welcome…"></textarea>
      <button class="go" id="gobtn" onclick="run()"><span class="spin"></span>Triage it</button>

      <div id="result">
        <div class="chips" id="chips"></div>
        <p style="margin-bottom:12px; font-size:.92rem;"><b>Summary:</b> <span id="summary"></span></p>
        <div class="draftbox"><button class="copybtn" onclick="copyDraft(this)">Copy</button><span id="draft"></span></div>
        <div class="meta" id="meta"></div>
      </div>
    </div>

    <div>
      <div class="panel" style="margin-bottom:16px;">
        <h2>Try a sample</h2>
        <button class="sample" onclick="sample(0)"><b>💥 Crash report</b>App crashes on login since the update…</button>
        <button class="sample" onclick="sample(1)"><b>💸 Angry customer</b>Charged twice and no order confirmation…</button>
        <button class="sample" onclick="sample(2)"><b>💡 Feature ask</b>Please add export to Excel…</button>
      </div>
      <div class="panel">
        <h2>Recent triages</h2>
        <div id="history"><div class="empty">Nothing triaged yet this session.</div></div>
      </div>
    </div>
  </div>

  <div class="panel" id="evalbox">
    <h2>Measured on a labeled test set</h2>
    <p style="color:var(--muted); font-size:.85rem; margin-bottom:16px;">
      15 real-world style issues with known correct answers. Rerun anytime with
      <code style="background:var(--bg); padding:2px 7px; border-radius:6px;">python -m evals.run_evals</code>.
    </p>
    <div id="evalsummary"></div>
    <table id="evaltable"></table>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const SAMPLES = [
  { title: "App crashes on login with Google SSO",
    body: "Since yesterday's release, tapping 'Sign in with Google' crashes the app immediately. Stack trace shows NullPointerException in AuthCallbackHandler. Happens for every user on our team. We literally cannot log in." },
  { title: "Charged twice, no order confirmation",
    body: "I bought the annual plan yesterday and my card was charged TWICE but I never got a confirmation email and my account still shows the free plan?? I need this fixed today or I want a full refund. Order refs: #88231 and #88232." },
  { title: "Add export to Excel",
    body: "Our finance team asks every month for the reports in Excel. PDF export exists but they end up retyping the numbers. Would save us hours." },
];
function sample(i){ $("title").value = SAMPLES[i].title; $("body").value = SAMPLES[i].body; run(); }

function tab(n){
  $("t1").classList.toggle("active", n===1); $("t2").classList.toggle("active", n===2);
  $("triagebox").style.display = n===1 ? "grid" : "none";
  $("evalbox").style.display = n===2 ? "block" : "none";
  if (n===2) loadEvals();
}

/* ---- history (localStorage) ---- */
function loadHistory(){
  const h = JSON.parse(localStorage.getItem("triages") || "[]");
  $("history").innerHTML = h.length
    ? h.map(x => `<div class="hist"><div class="t">${esc(x.title)}</div><div class="m"><i>${esc(x.priority)}</i> · ${esc(x.issue_type)} · ${esc(x.component)}</div></div>`).join("")
    : `<div class="empty">Nothing triaged yet this session.</div>`;
}
function pushHistory(title, res){
  const h = JSON.parse(localStorage.getItem("triages") || "[]");
  h.unshift({ title, priority: res.priority, issue_type: res.issue_type, component: res.component });
  localStorage.setItem("triages", JSON.stringify(h.slice(0, 8)));
  loadHistory();
}

async function run(){
  const title = $("title").value.trim();
  if (!title) return alert("Enter an issue title first.");
  const btn = $("gobtn"); btn.disabled = true; btn.classList.add("loading");
  $("result").style.display = "none";
  try {
    const r = await fetch("/api/triage", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ title, body: $("body").value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "Triage failed");
    const res = j.result, m = j.meta;
    $("chips").innerHTML =
      `<span class="chip">${esc(res.issue_type.replace("_"," "))}</span>` +
      `<span class="chip p-${esc(res.priority)}">🔥 ${esc(res.priority)}</span>` +
      `<span class="chip">📦 ${esc(res.component)}</span>` +
      res.labels.map(l => `<span class="chip">${esc(l)}</span>`).join("");
    $("summary").textContent = res.summary;
    $("draft").textContent = res.response_draft;
    $("meta").textContent = `${m.model} · ${m.latency_s}s · ${m.input_tokens}+${m.output_tokens} tokens · $${m.cost_usd} per triage`;
    $("result").style.display = "block";
    pushHistory(title, res);
  } catch (err) { alert(String(err.message || err)); }
  btn.disabled = false; btn.classList.remove("loading");
}

function copyDraft(btn){
  navigator.clipboard.writeText($("draft").textContent).then(() => {
    btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = "Copy", 1500);
  });
}

async function loadEvals(){
  const r = await fetch("/api/evals");
  if (!r.ok) { $("evalsummary").innerHTML = "<p class='empty'>No eval results yet — run <code>python -m evals.run_evals</code>.</p>"; $("evaltable").innerHTML = ""; return; }
  const j = await r.json(); const s = j.summary;
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  $("evalsummary").innerHTML =
    stat((s.exact_match_accuracy*100).toFixed(0)+"%", "exact match") +
    stat((s.field_accuracy.issue_type*100).toFixed(0)+"%", "type accuracy") +
    stat((s.field_accuracy.priority*100).toFixed(0)+"%", "priority accuracy") +
    stat((s.field_accuracy.component*100).toFixed(0)+"%", "component accuracy") +
    stat("$"+s.total_cost_usd, "total run cost") +
    stat(s.avg_latency_s+"s", "avg latency") + stat(s.p95_latency_s+"s", "p95 latency") +
    `<p style="color:var(--muted); font-size:.75rem;">model ${esc(s.model)} · ${s.cases} labeled cases · ${esc(s.run_at.slice(0,16).replace("T"," "))} UTC</p>`;
  $("evaltable").innerHTML = "<tr><th>Case</th><th>Type</th><th>Priority</th><th>Component</th></tr>" +
    j.rows.map(row => `<tr><td>${esc(row.title.slice(0,52))}</td>${["issue_type","priority","component"].map(f =>
      `<td class="${row.correct[f] ? "ok" : "miss"}">${esc(row.predicted[f])}${row.correct[f] ? " ✓" : " ✗ (exp: "+esc(row.expected[f])+")"}</td>`).join("")}</tr>`).join("");
}

loadHistory();
</script>
</body>
</html>
